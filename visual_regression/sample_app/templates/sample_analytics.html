<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Analytics & Metrics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .sidebar-mock { background: #0f172a; min-height: 100vh; color: #fff; padding: 24px; }
        .metric-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .metric-number {
            font-size: 2rem;
            font-weight: 700;
            color: {% if regressed %}#dc2626{% else %}#2563eb{% endif %};
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar-mock">
                <h5 class="fw-bold mb-4">AnalyticsPro</h5>
                <ul class="nav flex-column gap-2">
                    <li class="nav-item"><a class="nav-link text-white active" href="#">Overview</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="#">Traffic</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="#">Conversions</a></li>
                </ul>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold">Executive Real-Time Telemetry</h3>
                    <span class="badge bg-success">Status: Online</span>
                </div>

                <div class="row">
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="text-muted small text-uppercase">Monthly Active Users</div>
                            <div class="metric-number">{% if regressed %}42,100{% else %}84,200{% endif %}</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="text-muted small text-uppercase">API Request Rate</div>
                            <div class="metric-number">12.4k/s</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="text-muted small text-uppercase">Mean Latency</div>
                            <div class="metric-number">{% if regressed %}148ms{% else %}24ms{% endif %}</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metric-card">
                            <div class="text-muted small text-uppercase">Server Uptime</div>
                            <div class="metric-number">99.99%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
