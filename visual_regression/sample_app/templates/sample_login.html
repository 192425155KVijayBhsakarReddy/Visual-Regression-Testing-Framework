<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            padding: 32px;
        }
        .btn-submit {
            background-color: {% if regressed %}#16a34a{% else %}#2563eb{% endif %};
            color: #ffffff;
            width: 100%;
            padding: 10px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="fw-bold mb-1 text-center">Account Login</h4>
        <p class="text-muted small text-center mb-4">Enter credentials to access portal</p>
        <form>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" class="form-control" placeholder="user@company.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control" required>
            </div>
            <button type="button" class="btn-submit" id="login-submit-button">Sign In</button>
        </form>
    </div>
</body>
</html>
