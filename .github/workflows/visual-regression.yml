name: Visual Regression CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  visual-regression-test:
    name: Execute Visual Regression & Layout Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual_regression/requirements.txt

      - name: Run Unit & Integration Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHROME_BIN: /usr/bin/chromium-browser
          SELENIUM_HEADLESS: "true"
        run: |
          python -m pytest visual_regression/tests -v

      - name: Start Sample Application
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python visual_regression/sample_app/app.py &
          sleep 3
          curl --retry 5 --retry-connrefused http://127.0.0.1:5001/

      - name: Execute Visual Regression CLI Runner
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHROME_BIN: /usr/bin/chromium-browser
          SELENIUM_HEADLESS: "true"
        run: |
          python visual_regression/cli_runner.py --app-url http://127.0.0.1:5001/ --threshold 0.5 --output-dir reports_artifact

      - name: Upload Test Reports & Screenshot Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-reports
          path: |
            reports_artifact/
            visual_regression/storage/reports/
            visual_regression/storage/diffs/
            visual_regression/storage/heatmaps/

